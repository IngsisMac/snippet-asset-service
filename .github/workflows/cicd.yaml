name: Publish Image

on:
  push:
    branches: [main, dev]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # Need to do this at the start to be able to use test containers
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gradle build
        run: ./gradlew bootJar -x test
        shell: bash

      - name: Setup Image Name for Env
        id: image-env-name
        uses: ./.github/actions/image-env-name
        with:
          base-image-name: snippet-asset-service
          main-branch-name: "main"

      - name: Setup Branch Name for Tag
        id: tag-branch-name
        uses: ./.github/actions/tag-branch-name

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ingsismac/snippet-asset-service:latest
            ghcr.io/ingsismac/snippet-asset-service:${{ steps.tag-branch-name.outputs.tag }}
            ${{ github.ref_name == 'dev' && 'ghcr.io/ingsismac/snippet-asset-service:dev' || '' }}